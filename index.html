<style>

  .frm{display:grid;gap:6px;margin-bottom:8px;min-width:0} .frm[hidden]{display:none} .frm input{width:100%;min-width:0;height:38px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px;font-size:14px;background:#fff;color:var(--text)} .frm input:focus,.frm select:focus{outline:none;border-color:var(--accent)}

  .msg{font-size:13px;min-height:18px;margin:4px 0} .msg.ok{color:var(--accent)} .msg.err{color:var(--warn)}

  .pvbar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;background:var(--card);padding-top:calc(10px + env(safe-area-inset-top))} .pvbar .xbtn{position:static}
  .pvbody{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch} .pvbody img{width:100%;height:auto;display:block;background:#fff;box-shadow:0 2px 12px rgba(36,35,33,.12)}
  .pvacts{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)} .pvacts button{flex:1;height:42px;border-radius:var(--r);border:1px solid transparent;font-size:14.5px;font-weight:500} .pvacts .p{background:var(--text);color:#fff} .pvacts .s{background:var(--soft);color:var(--text);border-color:var(--line)}
  .pdfrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px 6px 10px;margin:0 0 6px} .pdfrow .ok{color:var(--muted)} .pdfrow .acts{display:flex;gap:6px} .pdfrow button{height:28px;padding:0 10px;font-size:12.5px;border:1px solid var(--accent);color:var(--accent);background:#fff;border-radius:var(--r)} .pdfrow button:hover{background:var(--accent);color:#fff}
  .shrt{display:none} .sbtn{display:none;border:1px solid var(--line);background:var(--card);border-radius:var(--r);width:32px;height:30px;font-size:14px}

  .toast.show{opacity:.92;transform:translateX(-50%)}
  dialog{max-height:92vh;max-height:92dvh;overflow:auto;position:relative;overscroll-behavior:contain}
  body.lock{position:fixed;left:0;right:0;overflow:hidden;width:100%}
  .xbtn{position:absolute;top:10px;right:10px;width:28px;height:28px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:var(--r);font-size:18px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center} .xbtn:hover{border-color:var(--text);color:var(--text)}
  dialog .btns{flex-wrap:wrap;position:sticky;bottom:-16px;background:var(--card);padding:8px 0 4px;margin-top:4px} dialog .btns button{flex:1 1 28%;min-width:0;white-space:nowrap} dialog .btns #closeBtn{flex:.8 1 20%} dialog .btns #pdf{flex:1.6 1 38%}
  dialog .btns .p{flex-basis:100%}
  @media (max-width:640px){
    header{padding:8px 12px}
    .brand{margin-bottom:0} .brand h1{font-size:14.5px;white-space:nowrap} .brand h1 .eb{display:none} .brand img{height:22px} .home{padding:3px 8px;font-size:11px}
    .sbtn{display:inline-block} .upd{display:none} .full{display:none} .shrt{display:inline} .search{display:none;margin-top:6px;height:34px} header.sopen .search{display:block}

    .trow.sub button{flex:0 0 auto;padding:4px 12px;font-size:12px;border-radius:var(--r);background:var(--soft);border-color:var(--soft)} .trow.sub button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
    .trow.sub button small{display:inline;opacity:.6;font-size:11px;margin-left:3px}
    main{padding:8px 10px}
    .item{padding:8px;gap:8px;grid-template-columns:52px 1fr auto;margin-bottom:6px} .ph{width:52px;height:52px;font-size:11px} .nm{font-size:14px} .pr{margin-top:2px}
    footer{padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
    .cartbox{max-height:88px;margin-bottom:4px} .crow{min-height:38px;padding:2px 8px;font-size:12px} .crow .cs{display:none}
    .tot{align-items:center} .tot b{font-size:17px} .sub{font-size:11px} .sub .vatw{display:none}
    .btns{margin-top:6px} .btns button{height:36px;font-size:14px}
  }
</style>

<body>
<header>
  <div class="wrap">
  <div class="brand"><img src="logo.png" alt="SOJAE 素材"><h1><span class="full">온라인 견적</span><span class="shrt">온라인 견적</span><small class="eb">Online Quote</small></h1><a class="home" id="homeLink" href="#" target="_blank" rel="noopener">홈페이지 보기 ↗</a><button class="sbtn" id="sbtn" aria-label="검색">🔍</button></div>
  <div class="upd" id="upd">품목 불러오는 중…</div>
  <input class="search" id="q" placeholder="품목 검색 (예: 우드3, 패브릭7, 엣지 24)" autocomplete="off">
  <div class="tabwrap"><div class="tabs" id="tabs"></div></div>
  </div>
</header>
<main id="list"><div class="empty">품목 불러오는 중…</div></main>
<noscript><div class="empty">이 페이지는 JavaScript가 필요합니다. 브라우저 설정에서 JavaScript를 켜 주세요.</div></noscript>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<footer>
  <div class="cartbox" id="cartbox"></div>
  <div class="tot"><div><button id="cartToggle">선택 품목 보기</button> <span class="sub">선택 <span id="cnt">0</span>품목<span class="vatw" hidden>공급가 <span id="sup">0</span>원 · 부가세 <span id="vat">0</span>원</span></span></div><div class="totr"><b id="total">0원</b><small>부가세 포함 · 배송비 별도</small></div></div>
  <div class="btns"><button class="s" id="clear">비우기</button><button class="s" id="quote">견적서만 보기</button><button class="p" id="order">주문/접수하기</button></div>
</footer>
<dialog id="dlg"><button class="xbtn" id="xbtn" aria-label="닫기" title="닫기">×</button><h3 style="margin:0 0 8px" id="dtitle">견적서</h3>
  <p class="hint" id="dhint"></p>
  <div class="frm"><select id="f_ship" aria-label="배송 지역"></select></div>
  <div class="frm" id="frm">
    <input id="f_company" placeholder="업체명 *" required maxlength="60">
    <input id="f_contact" placeholder="담당자 / 연락처 *" required maxlength="60" autocomplete="tel">
    <input id="f_addr" placeholder="배송지" maxlength="120">
    <input id="f_note" placeholder="요청사항 (납기, 문의 등)" maxlength="300">
    <input id="f_web" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
  </div>
  <pre id="txt"></pre>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <div id="pdfrow" class="pdfrow" hidden></div>
  <div class="btns"><button class="s" id="closeBtn">닫기</button><button class="s" id="copy">복사</button><button class="s" id="pdf">PDF 저장/공유</button><button class="p" id="send">주문/접수하기</button></div></dialog>
<script>
const fmt=n=>n.toLocaleString('ko-KR');
const etaTxt=d=>{const [y,m,dd]=d.split('-');return `${Number(m)}/${Number(dd)}`;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ▼ 요청 자동 접수용 서버 주소 (Cloudflare Worker). 비워두면 '요청 보내기' 대신 복사/공유만 가능.
const ENDPOINT='https://panel-order.ws-kim.workers.dev/';
// ▼ 소재 정보 홈페이지 (임시 주소 — 정식 도메인이 생기면 여기만 바꾸면 됨)
const HOME_URL='https://sojae-material-world.koretorian.chatgpt.site/#materials';
document.getElementById('homeLink').href=HOME_URL;
// ▼ 배송비 (남양주 출고 · 1톤 화물 기준 · 부가세 별도). 금액만 바꾸면 견적/PDF/접수에 모두 반영됨
const SHIP=[
  {id:'A',label:'서울·경기 근거리 (남양주·구리·하남·서울 전역·성남·의정부·광주·양주)',fee:50000},
  {id:'B',label:'경기 원거리·인천 (고양·김포·부천·인천·안양·수원·용인·파주·평택·화성·안산 등)',fee:90000},
  {id:'C',label:'충청·강원 (대전·세종·천안·청주·원주·춘천·강릉 등)',fee:110000},
  {id:'D',label:'전라·경북·대구 (전주·광주·대구·구미·포항 등)',fee:240000},
  {id:'E',label:'경남·부산·울산 (부산·울산·창원·김해·진주 등)',fee:350000},
  {id:'COD',label:'착불 (배송비 수령 시 화물기사에게 지불)',fee:0},
];
const SHIP_NOTE='제주·도서벽지 제외 · 1톤 화물 기준(약 30장 초과 시 별도 협의) · 야간/주말·양중 별도';
const shipSel=()=>SHIP.find(x=>x.id===document.getElementById('f_ship').value)||SHIP[0];
const shipFee=()=>shipSel().fee;
const shipTxt=()=>{const x=shipSel();return x.id==='COD'?'착불':x.label.split(' (')[0]+' '+fmt(x.fee)+'원';};
document.getElementById('f_ship').innerHTML=SHIP.map(x=>{const [nm,rest]=esc(x.label).split(' (');return `<option value="${x.id}">🚚 ${nm}${x.fee?' '+fmt(x.fee)+'원':''}${rest?' · '+rest.replace(/\)$/,''):''}</option>`;}).join('');
try{const sv=localStorage.getItem('ship');if(sv&&SHIP.some(x=>x.id===sv))document.getElementById('f_ship').value=sv;}catch(e){}
document.getElementById('f_ship').addEventListener('change',()=>{try{localStorage.setItem('ship',document.getElementById('f_ship').value);}catch(e){}buildText();});
const ORDER=['우드보드 19T','우드보드 10T','우드 엣지 24mm','우드 엣지 50mm','패브릭 보드 19T','패브릭 보드 10T'];
const natural=(a,b)=>a.localeCompare(b,'ko',{numeric:true});
let lastRows=[],data=[],cart={},cat='우드보드 19T',cartOpen=false;
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}};
function status(i){

// PDF 저장/공유: 견적서를 이미지로 찍어 A4 PDF 파일로 만든 뒤, 공유 시트가 있으면(모바일) 공유, 없으면(PC) 바로 내려받기.
// 라이브러리 로드 실패 등 문제가 있으면 예전 방식(인쇄 창 → PDF로 저장)으로 대체.
const loadScript=src=>new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const t=document.createElement('script');t.src=src;t.onload=ok;t.onerror=()=>no(new Error('load '+src));document.head.appendChild(t);});
async function makePdf(){
  await Promise.all([loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]);
  const fr=document.createElement('iframe');fr.setAttribute('aria-hidden','true');fr.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;opacity:0;pointer-events:none';
  document.body.appendChild(fr);
  try{
    const d=fr.contentDocument;d.open();d.write(quoteHtml(true));d.close();
    await new Promise(r=>{if(d.readyState==='complete')r();else fr.onload=r;setTimeout(r,1500);});
    await Promise.all([...d.images].map(im=>im.complete?null:new Promise(r=>{im.onload=im.onerror=r;})));
    if(d.fonts&&d.fonts.ready)await Promise.race([d.fonts.ready,new Promise(r=>setTimeout(r,1500))]);
    const ch=Math.max(d.body.scrollHeight,d.documentElement.scrollHeight);fr.style.height=ch+'px';
    const canvas=await html2canvas(d.body,{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:794,width:794,height:ch,windowHeight:ch,logging:false});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const pw=210,ph=297,imgH=canvas.width*ph/pw;  // 한 페이지에 해당하는 캔버스 높이(px)
    let y=0,page=0;
    while(y<canvas.height-4){  // 끝에 몇 px 남는 건 빈 페이지 만들지 않음
      const h=Math.min(imgH,canvas.height-y);
      const c=document.createElement('canvas');c.width=canvas.width;c.height=h;
      const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(page)pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,pw,h*pw/canvas.width);
      y+=h;page++;
    }
    return {blob:pdf.output('blob'),png:canvas.toDataURL('image/jpeg',0.9)};
  }finally{fr.remove();}
}
let lastPdf=null;
const mobileUA=()=>/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||isMobile();
document.getElementById('pdf').onclick=async()=>{
  const b=document.getElementById('pdf');if(b.disabled)return;
  const now=new Date();const no=`Q${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const fname=`SOJAE_견적서_${no}.pdf`;
  const mob=mobileUA();
  // PC: 미리보기 탭은 클릭 직후(동기)에 열어야 팝업 차단에 걸리지 않음. 모바일: 새 탭 대신 페이지 안 미리보기(모바일 브라우저는 PDF 탭 표시가 제각각)
  const w=mob?null:window.open('','_blank');
  if(w){try{w.document.write('<!doctype html><title>SOJAE 素材 견적서</title><body style="font-family:sans-serif;color:#6b6862;padding:40px;text-align:center">견적서 PDF를 만드는 중입니다…</body>');}catch(e){}}
  b.disabled=true;const label=b.textContent;b.textContent='PDF 만드는 중…';
  try{
    const {blob,png}=await Promise.race([makePdf(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),20000))]);
    lastPdf={blob,name:fname,no,png};
    if(w){w.location.href=URL.createObjectURL(blob);}
    showPdfRow();
    if(mob)openPreview();
  }catch(e){
    // 대체: 인쇄용 견적서 페이지 → 인쇄/PDF로 저장
    if(w){w.document.open();w.document.write(quoteHtml());w.document.close();let printed=false;const go=()=>{if(printed)return;printed=true;try{w.focus();w.print();}catch(e2){}};w.onload=()=>setTimeout(go,400);setTimeout(go,1500);}
    else{const w2=window.open('','_blank');if(w2){w2.document.open();w2.document.write(quoteHtml());w2.document.close();}else alert('PDF를 만들지 못했습니다. 잠시 후 다시 시도해 주세요.');}
  }finally{b.disabled=false;b.textContent=label;}
};
// 모바일 미리보기: 견적서 이미지를 전체 화면으로 보여주고 아래에 공유/다운로드
function openPreview(){
  if(!lastPdf)return;
  let pv=document.getElementById('pv');
  if(!pv){pv=document.createElement('dialog');pv.id='pv';pv.className='pv';document.body.appendChild(pv);}
  const file=new File([lastPdf.blob],lastPdf.name,{type:'application/pdf'});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  pv.innerHTML=`<div class="pvbar"><span>📄 ${esc(lastPdf.name)}</span><button type="button" class="xbtn" id="pvClose" aria-label="닫기">×</button></div>
    <div class="pvbody"><img src="${lastPdf.png}" alt="견적서 미리보기"></div>
    <div class="pvacts">${canShare?'<button type="button" class="p" id="pvShare">공유하기</button>':''}<button type="button" class="${canShare?'s':'p'}" id="pvDl">PDF 다운로드</button></div>`;
  if(!pv.open){lockBody();pv.showModal();pv.addEventListener('close',unlockBody,{once:true});}
  const close=()=>pv.close();
  document.getElementById('pvClose').onclick=close;
  if(canShare)document.getElementById('pvShare').onclick=async()=>{try{await navigator.share({files:[file],title:'SOJAE 素材 견적서 '+lastPdf.no});}catch(e){if(e.name!=='AbortError')downloadBlob(lastPdf.blob,lastPdf.name);}};
  document.getElementById('pvDl').onclick=()=>downloadBlob(lastPdf.blob,lastPdf.name);
}
// PDF를 만든 뒤 창 안에 "공유 / 다운로드" 줄을 보여준다 (공유는 버튼을 눌러야 열리는 OS 공유창)
function showPdfRow(){
  const row=document.getElementById('pdfrow');if(!row||!lastPdf)return;
  const file=new File([lastPdf.blob],lastPdf.name,{type:'application/pdf'});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  const mob=mobileUA();
  row.innerHTML=`<span>📄 ${esc(lastPdf.name)}${mob?'':' <span class="ok">— 새 탭에서 미리보기</span>'}</span><span class="acts">${mob?'<button type="button" id="pdfPv">미리보기</button>':''}${canShare?'<button type="button" id="pdfShare">공유</button>':''}<button type="button" id="pdfDl">다운로드</button></span>`;
  row.hidden=false;
  if(canShare)document.getElementById('pdfShare').onclick=async()=>{try{await navigator.share({files:[file],title:'SOJAE 素材 견적서 '+lastPdf.no});}catch(e){if(e.name!=='AbortError')downloadBlob(lastPdf.blob,lastPdf.name);}};
  document.getElementById('pdfDl').onclick=()=>downloadBlob(lastPdf.blob,lastPdf.name);
  if(mob)document.getElementById('pdfPv').onclick=openPreview;
}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
load();
