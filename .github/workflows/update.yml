name: 재고 갱신(stock.json)

on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"   # 매시 35분 (panel-sync 가 20분에 외부 공개 재고를 갱신한 뒤 → stock.json)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python export_stock.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Commit
        run: |
          git config user.name  "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add stock.json
          git diff --cached --quiet || git commit -m "재고 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
